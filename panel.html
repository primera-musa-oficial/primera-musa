<script id="loginNubeUniversalMusa">
(function() {
  const URL_SB = "https://" + "gkelkdxfmdlvcvyjvwmu" + ".supabase.co/rest/v1/musa_estado";
  const KEY_SB = "sb_publishable_cYTRqB0q933Y23txZK2-wg_NYkJ7OL0";

  // Descargar usuarios y cola desde Supabase apenas abre la página en cualquier teléfono nuevo
  async function sincronizarUsuariosDesdeNube() {
    try {
      const r = await fetch(URL_SB + "?clave=in.(cola_turnos_local,usuarios_clientes_musa)&select=clave,datos", {
        headers: { "apikey": KEY_SB, "Authorization": "Bearer " + KEY_SB }, cache: "no-store"
      });
      const filas = await r.json();
      if (!Array.isArray(filas)) return;
      filas.forEach(f => {
        const d = typeof f.at(0).datos === "string" ? JSON.parse(f.at(0).datos) : f.at(0).datos;
        if (f.clave === "cola_turnos_local" && Array.isArray(d)) {
          localStorage.setItem("cola_turnos_local", JSON.stringify(d));
          const usrs = d.map(x => ({ usuario: x.usuario, clave: x.clave || x.password || x.pass || "" }));
          const prev = JSON.parse(localStorage.getItem("usuarios_clientes_musa") || "[]");
          const mapa = new Map(prev.map(u => [String(u.usuario || "").toLowerCase(), u]));
          usrs.forEach(u => { if (u.usuario && u.clave) mapa.set(String(u.usuario).toLowerCase(), u); });
          localStorage.setItem("usuarios_clientes_musa", JSON.stringify(Array.from(mapa.values())));
        }
        if (f.clave === "usuarios_clientes_musa" && Array.isArray(d)) {
          const prev = JSON.parse(localStorage.getItem("usuarios_clientes_musa") || "[]");
          const mapa = new Map(prev.map(u => [String(u.usuario || "").toLowerCase(), u]));
          d.forEach(u => { if (u.usuario) mapa.set(String(u.usuario).toLowerCase(), u); });
          localStorage.setItem("usuarios_clientes_musa", JSON.stringify(Array.from(mapa.values())));
        }
      });
    } catch {}
  }

  sincronizarUsuariosDesdeNube();

  // Interceptar el clic en Entrar para asegurar que sincronizó con la nube antes de validar
  let _reintentoLoginNube = false;
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b || _reintentoLoginNube) return;
    const t = (b.innerText || "").toLowerCase();
    if (t.includes("entrar") || t.includes("iniciar") || t.includes("acceder")) {
      const listaLocal = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
      if (listaLocal.length === 0) {
        e.preventDefault();
        e.stopImmediatePropagation();
        b.innerText = "⏳ Conectando con la nube...";
        await sincronizarUsuariosDesdeNube();
        b.innerText = "🎄 Entrar a mi Suite VIP ✨";
        _reintentoLoginNube = true;
        b.click();
        setTimeout(() => { _reintentoLoginNube = false; }, 500);
      }
    }
  }, true);
})();
</script>

function cargarFotoNueva(inp) {
  if (!inp.files || !inp.files.length) return;
  Array.from(inp.files).forEach(f => {
    if (window.fotosSubidasVIP.length >= 5) return;
    const r = new FileReader();
    r.onload = e => { window.fotosSubidasVIP.push(e.target.result); window.fotosConEmoji.push(false); dibujarFotosNuevas(); };
    r.readAsDataURL(f);
  });
}

function guardarStickerNuevo(idx) {
  const emo = document.getElementById("emojiMovil"), img = document.getElementById("fotoBaseSt"), rI = img.getBoundingClientRect(), rE = emo.getBoundingClientRect();
  const cv = document.createElement("canvas"); cv.width = img.naturalWidth || 800; cv.height = img.naturalHeight || 1000;
  const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0, cv.width, cv.height);
  ctx.font = `${Math.round(cv.width * (rE.width / rI.width) * 0.9)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(emo.innerText, cv.width * ((rE.left + rE.width/2 - rI.left)/rI.width), cv.height * ((rE.top + rE.height/2 - rI.top)/rI.height));

function formatearFechaPublicadaMP(ts) {
  const d = new Date(ts || Date.now());
  const dias = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const meses = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0"), ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]} at ${h}:${m} ${ampm}`;
}

function formatearVenceCortoMP(ms) {
  if (!ms || ms <= Date.now()) return "Sin activar";
  const d = new Date(Number(ms));
  const dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0"), ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${dias[d.getDay()]} ${d.getDate()} • ${h}:${m} ${ampm}`;
}

function bumpManualCliente(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
  const it = l.find(x => x.id === id); if (!it) return;
  const ahora = Date.now();
  const minPermitido = Number(it.ultima_subida_ms || 0) + (16 * 60000);
  if (ahora < minPermitido) {
    const faltanMin = Math.ceil((minPermitido - ahora) / 60000);
    return alert(`🛡️ PROTECCIÓN ANTI-BLOQUEO:\nLa página prohíbe subir antes de 16 minutos.\nFaltan ${faltanMin} minuto(s) para volver a subir de forma segura.`);
  }
  it.ultima_subida_ms = ahora;
  it.proximo_bump_ms = ahora + (16 + Math.floor(Math.random() * 4)) * 60000;
  if (!Array.isArray(it.historial_cambios)) it.historial_cambios = [];
  it.historial_cambios.push({ hora: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), detalle: "🚀 Pulsó BUMP TO TOP seguro (+16 min)" });
  localStorage.setItem("cola_turnos_local", JSON.stringify(l));
  alert("🚀 ¡Anuncio subido al tope de forma segura! Próximo ciclo programado entre 16 y 20 minutos.");
  renderizarSuiteInterna();
}
function togglePausaDesdeCliente(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
  const it = l.find(x => x.id === id);
  if (!it) return;
  const nuevoActivo = !it.activo;
  it.activo = nuevoActivo;
  it.detenido = !nuevoActivo;
    if (nuevoActivo) {
    it.pausa_18h = false;
    it.inicio_jornada_ms = Date.now();
    const minSeguroMs = Date.now() + (16 * 60000);
    const nuevoAleatorioMs = Date.now() + ((16 + Math.floor(Math.random() * 4)) * 60000);
    it.proximo_bump_ms = Math.max(minSeguroMs, nuevoAleatorioMs);
  }
  if (!Array.isArray(it.historial_cambios)) it.historial_cambios = [];
  it.historial_cambios.push({ hora: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), detalle: nuevoActivo ? "▶️ Reanudó su anuncio" : "⏸️ Pausó su anuncio" });
  localStorage.setItem("cola_turnos_local", JSON.stringify(l));
  renderizarSuiteInterna();
}

function abrirEditorAnuncioCliente(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
  const it = l.find(x => x.id === id);
  if (!it) return;
  it.editando_en_vivo = Date.now();
  localStorage.setItem("cola_turnos_local", JSON.stringify(l));
  document.getElementById("suiteInternaCliente").innerHTML = `
    <div style="background:#fff;border:1.5px solid #f43f5e;border-radius:16px;padding:16px;text-align:left;box-shadow:0 8px 20px rgba(0,0,0,0.1);">
      <div style="font-size:14px;font-weight:900;color:#be123c;margin-bottom:10px;text-align:center;">✏️ EDITAR MI ANUNCIO EN VIVO</div>
      <label style="font-size:11px;font-weight:700;color:#334155;">Alias:</label>
      <input id="edAlias" type="text" value="${it.alias || ""}" style="background:#f8fafc;color:#0f172a;border:1px solid #cbd5e1;">
      <label style="font-size:11px;font-weight:700;color:#334155;">Headline:</label>
      <input id="edHead" type="text" value="${it.headline || ""}" style="background:#f8fafc;color:#0f172a;border:1px solid #cbd5e1;">
      <label style="font-size:11px;font-weight:700;color:#334155;">Body:</label>
      <textarea id="edBody" rows="3" style="background:#f8fafc;color:#0f172a;border:1px solid #cbd5e1;">${it.body || ""}</textarea>
      <label style="font-size:11px;font-weight:700;color:#334155;">Teléfono (+1):</label>
      <input id="edPhone" type="tel" maxlength="10" value="${it.phone || ""}" style="background:#f8fafc;color:#0f172a;border:1px solid #cbd5e1;">
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button type="button" onclick="renderizarSuiteInterna()" style="flex:1;padding:10px;border-radius:10px;border:1px solid #cbd5e1;background:#f1f5f9;color:#334155;font-weight:800;cursor:pointer;">Cancelar</button>
        <button type="button" onclick="guardarEdicionCliente(${id})" style="flex:1;padding:10px;border-radius:10px;border:none;background:#e11d48;color:#fff;font-weight:900;cursor:pointer;">Guardar Cambios ✅</button>
      </div>
    </div>`;
}

function guardarEdicionCliente(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
  const it = l.find(x => x.id === id);
  if (!it) return;
  it.alias = document.getElementById("edAlias").value.trim() || it.alias;
  it.headline = document.getElementById("edHead").value.trim();
  it.body = document.getElementById("edBody").value.trim();
  it.phone = document.getElementById("edPhone").value.replace(/\D/g, "") || it.phone;
  it.editando_en_vivo = 0;
  it.total_ediciones = Number(it.total_ediciones || 0) + 1;
  it.cambio_pendiente_mp = true;
  if (!Array.isArray(it.historial_cambios)) it.historial_cambios = [];
  it.historial_cambios.push({ hora: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), detalle: `✏️ Editó su anuncio (Edición #${it.total_ediciones})` });
  localStorage.setItem("cola_turnos_local", JSON.stringify(l));
  alert("✅ ¡Cambios guardados y notificados a La Musa!");
  renderizarSuiteInterna();
}

function reportarFallaDesdeCliente(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
  const it = l.find(x => x.id === id);
  if (!it) return;
  const msg = prompt("Describe qué pasa con tu página o anuncio (llegará directo a La Musa por orden de llegada):");
  if (!msg || !msg.trim()) return;
  const reps = JSON.parse(localStorage.getItem("reportes_clientes_local") || "[]");
  const idxPag = String(it.ultimo_anuncio || "").indexOf("PAGINA:");
  const pag = idxPag !== -1 ? String(it.ultimo_anuncio).slice(idxPag + 7).split("|").trim() : "Sin asignar";
  reps.push({ id: Date.now(), usuario: it.usuario, alias: it.alias || it.usuario, pagina: pag, tipo: "🚨 Reporte desde Panel de Clienta", mensaje: msg.trim(), hora: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), resuelto: false, respuesta_admin: "" });
  localStorage.setItem("reportes_clientes_local", JSON.stringify(reps));
  alert("✅ Tu reporte fue enviado por orden de llegada. Te responderemos aquí mismo.");
}

}

<script>


function iniciarColaEdicionVIP(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]"), it = l.find(x => x.id === id);
  if (!it) return;
  it.estado_edicion = "esperando"; it.editando_en_vivo = Date.now();
  localStorage.setItem("cola_turnos_local", JSON.stringify(l)); renderizarSuiteInterna();
  setTimeout(() => {
    const l2 = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]"), it2 = l2.find(x => x.id === id);
    if (it2 && it2.estado_edicion === "esperando") { it2.estado_edicion = "listo"; localStorage.setItem("cola_turnos_local", JSON.stringify(l2)); renderizarSuiteInterna(); }
  }, 5000);
}

function abrirEditorAnuncioCliente(id) {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]"), it = l.find(x => x.id === id);
  if (!it) return;
  const telFmt = it.phone ? "+1 " + String(it.phone).replace(/(\d{3})(\d{3})(\d{4})/, "($1) $2-$3") : "Sin teléfono";
  const baseTel = Number(it.ultimo_cambio_tel_ms || it.id || Date.now());
  const faltaMs = Math.max(0, (baseTel + 48 * 3600000) - Date.now());
  const hF = Math.floor(faltaMs / 3600000), mF = Math.floor((faltaMs % 3600000) / 60000);

  let m = document.getElementById("modalPreEdicionVIP");
  if (!m) { m = document.createElement("div"); m.id = "modalPreEdicionVIP"; m.style.cssText = "position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:16px;"; document.body.appendChild(m); }
  m.style.display = "flex";
  m.innerHTML = `<div style="background:linear-gradient(165deg,#09241b,#040f0c);border:2px solid #eab308;border-radius:22px;max-width:400px;width:94vw;padding:20px;color:#fff;text-align:left;">
    <h3 style="margin:0 0 4px;font-size:20px;">✏️ Editar publicación</h3>
    <div style="font-size:12px;color:#fde047;margin-bottom:12px;">Vas a editar el post del número <b>${telFmt}</b></div>
    <div style="background:rgba(0,0,0,0.45);border:1px solid rgba(234,179,8,0.35);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.45;margin-bottom:12px;">
      <b style="color:#38bdf8;">¿Cómo funciona?</b><br>1. Se generará una verificación en su próximo turno (1-15 min).<br>2. El botón pasará a decir <b style="color:#fde047;">"🔓 CONTINUAR"</b>.<br>3. Solo puedes cambiar teléfono cada <b>48 h</b> (lo realiza el Admin).<br>4. Tendrás <b>15 minutos</b> para guardar.
    </div>
    <div style="background:rgba(239,68,68,0.18);border:1px solid #f87171;border-radius:10px;padding:9px;font-size:11.5px;font-weight:800;color:#fecaca;margin-bottom:14px;text-align:center;">
      ${faltaMs <= 0 ? "📞 Cambio de número: disponible (Solicítalo al Admin) ✅" : `🔒 Cambio de número bloqueado • Faltan ${hF}h ${mF}m`}
    </div>
    <div style="display:flex;gap:8px;">
      <button type="button" onclick="document.getElementById('modalPreEdicionVIP').style.display='none'" style="flex:1;padding:11px;border-radius:10px;border:1px solid #64748b;background:transparent;color:#fff;font-weight:800;">Cancelar</button>
      <button type="button" onclick="document.getElementById('modalPreEdicionVIP').style.display='none';iniciarColaEdicionVIP(${it.id});" style="flex:1;padding:11px;border-radius:10px;border:none;background:#eab308;color:#000;font-weight:900;">Iniciar edición</button>
    </div></div>`;
}
</script>

<script>
window.renderizarSuiteInterna = function() {
  const box = document.getElementById("suiteInternaCliente");
  const lista = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]");
  const u = String(window.usuarioLogueadoVIP || "").toLowerCase();
  const mis = lista.filter(x => String(x.usuario || "").toLowerCase() === u && !x.bloqueada);
  if (mis.length === 0) { box.innerHTML = `<p style="color:#fff;">Sin anuncios.</p>`; return; }

  let idxSel = Number(sessionStorage.getItem("indice_anuncio_vip"));
  if (isNaN(idxSel) || idxSel < 0 || idxSel >= mis.length) idxSel = mis.length - 1;
  const c = mis[idxSel];
  window.anuncioActivoIdVIP = c.id;

  const tabsHtml = mis.length > 1 ? `
    <div style="background:rgba(0,0,0,0.5);border:1px solid #eab308;border-radius:14px;padding:8px;margin:8px 0;">

      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;">
        ${mis.map((an, i) => `<button type="button" onclick="sessionStorage.setItem('indice_anuncio_vip','${i}');renderizarSuiteInterna();" style="flex-shrink:0;padding:6px 10px;border-radius:10px;border:1.5px solid ${i===idxSel?'#fde047':'#475569'};background:${i===idxSel?'#dc2626':'#0f172a'};color:#fff;font-size:11px;font-weight:900;cursor:pointer;">${i===idxSel?'💖':'❤️'} #${i+1} • ${an.city||'Ciudad'}</button>`).join("")}

    </div>
    ${(c.estado_edicion==="esperando"||c.estado_edicion==="listo"||c.estado_edicion==="pendiente_aplicar")
      ? `<button disabled style="width:85%;background:#a78bfa;border:none;border-radius:10px;padding:9px;color:#fff;font-weight:900;font-size:11.5px;margin-bottom:8px;">🔒 NO SE PUEDE PAUSAR (EDITANDO)</button>`
      : `<button type="button" onclick="togglePausaDesdeCliente(${c.id})" style="width:78%;background:${c.activo?'#7c3aed':'#059669'};border:none;border-radius:8px;padding:10px;color:#fff;font-weight:900;font-size:12px;margin-bottom:8px;">${c.activo?'⏸ PAUSAR ANUNCIO':'▶ REANUDAR ANUNCIO'}</button>`}
    ${avisoEd}
    <div style="background:rgba(0,0,0,0.5);border:1px solid #eab308;border-radius:10px;padding:8px;color:#fde047;font-weight:800;font-size:12.5px;margin-bottom:6px;">${c.headline||""}</div>
    <div style="font-size:11.5px;text-align:left;margin-bottom:6px;">📞 <b>+1 ${c.phone||""}</b> • 📍 <b>${c.city||""}, ${c.state||"FL"}</b> • Edad: <b>${c.age||"23"}</b></div>

function enviarTicketAyudaVIP(motivo) {
  const det = prompt(motivo + "\n\nEscribe detalles adicionales (o pulsa Aceptar para enviar directo):", motivo);
  if (det === null) return;
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]"), it = l.find(x => x.id === window.anuncioAyudaId) || l || {};
  const reps = JSON.parse(localStorage.getItem("reportes_clientes_local") || "[]");
  reps.push({ id: Date.now(), usuario: it.usuario || window.usuarioLogueadoVIP, alias: `${it.alias||it.usuario} (${it.city||""})`, pagina: "Asignada", tipo: motivo, mensaje: det || motivo, hora: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), resuelto: false, respuesta_admin: "" });
  localStorage.setItem("reportes_clientes_local", JSON.stringify(reps));
  alert("✅ Reporte enviado (Turno #" + reps.length + "). Te responderemos arriba en tu panel.");
  document.getElementById("modalAyudaVIP").style.display = "none";
}

function abrirCambioTelYFotosVIP() {
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]"), it = l.find(x => x.id === window.anuncioAyudaId) || l || {};
  const baseTel = Number(it.ultimo_cambio_tel_ms || it.id || Date.now());
  const puedeTel = Date.now() >= (baseTel + 48 * 3600000);
  const fDesb = new Date(baseTel + 48 * 3600000);
  document.getElementById("contenidoAyudaDinamico").innerHTML = `
    <h3 style="margin:0 0 6px;font-size:18px;font-weight:900;color:#0f172a;">📞📷 Cambiar Número o Fotos</h3>
    <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:8px;font-size:11px;color:#991b1b;font-weight:800;margin-bottom:10px;">⚠️ Regla obligatoria: Solo se permite cambiar <b>teléfono solo</b> o <b>teléfono + fotos nuevas juntas</b> (nunca solo fotos sin número nuevo).</div>
    ${puedeTel ? `
      <b>📞 Nuevo Teléfono Obligatorio (10 dígitos): *</b>
      <input id="solNewTel" type="tel" maxlength="10" placeholder="Ej. 3055550199" style="width:100%;box-sizing:border-box;background:#f8fafc;color:#000;border:1.5px solid #f472b6;border-radius:8px;padding:8px;margin:4px 0 8px;">
      <b>📷 Fotos Nuevas (Opcional con el nuevo número):</b>
      <input id="solNewPics" type="file" accept="image/*" multiple style="width:100%;font-size:11px;margin:4px 0 12px;">
      <button type="button" onclick="enviarCambioManualAdminVIP(${it.id||0})" style="width:100%;padding:12px;border-radius:12px;border:none;background:#db2777;color:#fff;font-weight:900;cursor:pointer;">Enviar Solicitud al Admin ➔</button>
    ` : `<div style="background:#fef2f2;border:1.5px solid #f87171;border-radius:12px;padding:12px;text-align:center;color:#991b1b;font-size:12px;font-weight:800;">🔒 Bloqueado por regla de 48h.<br>Disponible el ${fDesb.toLocaleDateString("es-ES")} a las ${fDesb.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}.</div>`}`;
}

async function enviarCambioManualAdminVIP(id) {
  const tel = (document.getElementById("solNewTel")?.value || "").replace(/\D/g, "");
  if (tel.length !== 10) return alert("⚠️ Debes escribir un teléfono válido de 10 dígitos.");
  const files = Array.from(document.getElementById("solNewPics")?.files || []);
  const fotosB64 = [];
  for (const f of files.slice(0, 8)) { fotosB64.push(await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); })); }
  const l = JSON.parse(localStorage.getItem("cola_turnos_local") || "[]"), it = l.find(x => x.id === id) || l || {};
  const reps = JSON.parse(localStorage.getItem("reportes_clientes_local") || "[]");
  reps.push({ id: Date.now(), usuario: it.usuario || window.usuarioLogueadoVIP, alias: `${it.alias||it.usuario} (${it.city||""})`, pagina: "Cambio Manual", tipo: "📞📷 Cambio Número/Fotos", mensaje: `📞 Nuevo Teléfono: +1 ${tel}` + (fotosB64.length ? `\n📷 ${fotosB64.length} foto(s) nueva(s) adjuntas` : ""), nuevo_telefono: tel, fotos_nuevas: fotosB64, hora: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), resuelto: false, respuesta_admin: "" });
  localStorage.setItem("reportes_clientes_local", JSON.stringify(reps));
  alert("✅ Solicitud enviada al Admin (Turno #" + reps.length + ").");
  document.getElementById("modalAyudaVIP").style.display = "none";
}
</script>

<script id="validacionEdadMinima21">
(function() {
  function obtenerInputsEdad() {
    return Array.from(document.querySelectorAll("input")).filter(inp => {
      const idn = (inp.id + " " + inp.name + " " + inp.placeholder).toLowerCase();
      const lbl = inp.previousElementSibling ? (inp.previousElementSibling.innerText || "").toLowerCase() : "";
      return idn.includes("edad") || idn.includes("age") || lbl.includes("edad") || lbl.includes("age");
    });
  }

  setInterval(() => {
    obtenerInputsEdad().forEach(inp => {
      inp.setAttribute("min", "21");
    });
  }, 1500);

  document.addEventListener("change", (e) => {
    const inp = e.target;
    if (obtenerInputsEdad().includes(inp) && inp.value !== "") {
      const val = parseInt(inp.value, 10);
      if (isNaN(val) || val < 21) {
        alert("⚠️ La edad mínima permitida es 21 años.");
        inp.value = "21";
      }
    }
  }, true);

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const t = (b.innerText || "").toLowerCase();
    if (t.includes("publicar") || t.includes("guardar") || t.includes("enviar") || t.includes("crear") || t.includes("post") || t.includes("save")) {
      const invalido = obtenerInputsEdad().find(inp => inp.offsetParent !== null && inp.value !== "" && parseInt(inp.value, 10) < 21);

        e.preventDefault();
        e.stopImmediatePropagation();
        alert("⚠️ La edad mínima permitida es 21 años.");

        invalido.focus();
      }
    }
  }, true);
})();
</script>

  function txtTranscurrido(ms) {
    if (!ms || ms <= 0) return "en espera de turno";
    const s = Math.max(1, Math.floor((Date.now() - ms) / 1000));
    if (s < 60) return "hace unos segundos";
    const m = Math.floor(s / 60);
    if (m < 60) return "hace " + m + " min";
    return "hace " + Math.floor(m / 60) + " h";
  }

  window.addEventListener("load", () => {
    if (typeof window.celebrarSubidaAnuncioVIP === "function") {
      const orig = window.celebrarSubidaAnuncioVIP;
      window.celebrarSubidaAnuncioVIP = function() {
        const r = orig.apply(this, arguments);
        if (!window._musaPausadoAhora) {
          const u = getUsr().toLowerCase().replace(/[^a-z0-9]/g, "") || "cliente";
          const act = leerStats();
          localStorage.setItem("musa_stats_bumps_" + u, JSON.stringify({ fecha: hoyClave(), count: act.count + 1, ultimaMs: Date.now() }));
          mantenerFijosEnPanel();
        }
        return r;

    const u = getUsr();

      btnPago.style.cssText = "display:block;width:100%;margin:8px auto;padding:11px 16px;font-weight:900;font-size:13.5px;";
      btnPago.onclick = () => { if (typeof window.abrirChatPagoEnVivo === "function") window.abrirChatPagoEnVivo(u); };
      btnPausar.parentElement.insertBefore(btnPago, btnPausar);
    }

    // 2. Mantener barra de Subidas al tope hoy fija debajo de Pausar
    let cajaStats = document.getElementById("cajaEstadisticasSubidasVIP");
    if (!cajaStats) {
      cajaStats = document.createElement("div");
      cajaStats.id = "cajaEstadisticasSubidasVIP";

  // Vigilar cambios en el DOM al instante (0ms) para que nunca desaparezcan al redibujar
  const obs = new MutationObserver(() => mantenerFijosEnPanel());
  obs.observe(document.body, { childList: true, subtree: true });
  setInterval(mantenerFijosEnPanel, 2000);
})();
</script>
