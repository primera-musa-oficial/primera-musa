<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIMERA MUSA ADMIN</title><style>*{box-sizing:border-box;font-family:Segoe UI,sans-serif}body{margin:0;background:#060913;color:#f8fafc;padding:16px}.wrap{max-width:1000px;margin:0 auto}.box{max-width:380px;margin:50px auto;background:#0f172a;border:1px solid #334155;border-top:3px solid #eab308;border-radius:16px;padding:24px}h2{text-align:center;color:#fde047;margin:0 0 14px}input{width:100%;padding:11px;margin:6px 0 12px;border-radius:10px;border:1px solid #334155;background:#060a14;color:#fff}.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#eab308;color:#090d16;font-weight:900;cursor:pointer}.hide{display:none!important}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:#0f172a;border:1px solid #334155;border-top:3px solid #eab308;border-radius:14px;padding:14px 18px;margin-bottom:16px}.tab{padding:8px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:800;cursor:pointer}.tab.on{background:#eab308;color:#090d16}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:15px}.rbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.rbtns button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer}</style></head><body><div class="wrap"><div id="vL" class="box"><h2>PRIMERA MUSA ADMIN</h2><input id="au" placeholder="Usuario"><input id="ap" type="password" placeholder="Clave"><button class="btn" onclick="entrar()">ENTRAR</button></div><div id="vP" class="hide"><div class="top"><b style="color:#fde047;font-size:18px">PRIMERA MUSA &bull; ADMIN</b><div><button class="tab on" id="t1" onclick="tab(1)">Cuentas (<span id="n1">0</span>)</button> <button class="tab" id="t2" onclick="tab(2)">Solicitudes (<span id="n2">0</span>)</button> <button class="tab" style="background:#7f1d1d" onclick="salir()">Salir</button></div></div><div id="g1" class="grid"></div><div id="g2" class="grid hide"></div></div></div><script>const U="https://supabase.co",K="sb_publishable_cYTRqB0q933Y23txZK2-wg_NYkJ7OL0";function sb(p,o){o=o||{};o.headers=Object.assign({apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},o.headers||{});return fetch(U+"/"+p,o);}function entrar(){if(au.value.trim()==="admin"&&ap.value.trim()==="Musa2026*"){localStorage.setItem("adm","1");vL.classList.add("hide");vP.classList.remove("hide");cargar();}else alert("Datos incorrectos");}function salir(){localStorage.removeItem("adm");location.reload();}function tab(n){t1.classList.toggle("on",n===1);t2.classList.toggle("on",n===2);g1.classList.toggle("hide",n!==1);g2.classList.toggle("hide",n!==2);}async function cargar(){if(localStorage.getItem("adm")!=="1")return;const[r1,r2]=await Promise.all([sb("cuentas_bot?select=*&order=updated_at.desc"),sb("solicitudes?select=*")]);const bs=await r1.json()||[],ss=await r2.json()||[],now=Date.now();n1.innerText=bs.length;n2.innerText=ss.length;g1.innerHTML=bs.map(b=>{const vm=Number(b.vence_ms||0),vc=vm>0&&now>=vm,ac=!!b.activo&&!vc,ds=vc?0:(vm>0?Math.max(0,Math.ceil((vm-now)/86400000)):0);return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${b.cuenta||b.bot_id}</b><b style="color:${vc?"#f87171":(ac?"#4ade80":"#fbbf24")}">${vc?"VENCIDO":(ac?"ACTIVO":"PAUSADO")}</b></div><div style="font-size:12px;color:#94a3b8;margin-top:6px">Tel: ${b.telefono||"-"}<br>User: <b style="color:#fde047">${b.usuario||"-"}</b> | Pass: <b style="color:#fde047">${b.clave||"-"}</b><br>Subidas: <b>${b.bumps||0}</b> | Renta: <b>${ds}d</b></div><div class="rbtns"><button style="background:${ac?"#ea580c":"#16a34a"};color:#fff" onclick="tog(\x27${b.bot_id}\x27,${!ac})">${ac?"Pausar":"Activar"}</button><button style="background:#7c3aed;color:#fff" onclick="cred(\x27${b.bot_id}\x27,\x27${b.usuario||""}\x27,\x27${b.clave||""}\x27)">Usuario/Clave</button></div><div class="rbtns"><button style="background:#1e293b;color:#fde047" onclick="dias(\x27${b.bot_id}\x27,7)">+7d</button><button style="background:#1e293b;color:#fde047" onclick="dias(\x27${b.bot_id}\x27,15)">+15d</button><button style="background:#1e293b;color:#fde047" onclick="dias(\x27${b.bot_id}\x27,30)">+30d</button><button style="background:#7f1d1d;color:#fecaca" onclick="delB(\x27${b.bot_id}\x27)">Borrar</button></div></div>`;}).join("");g2.innerHTML=ss.map(s=>{const fs=(Array.isArray(s.fotos)?s.fotos:[]).map((im,i)=>`<a href="${im}" download="foto_${i+1}.jpg"><img src="${im}" style="width:65px;height:65px;object-fit:cover;border-radius:8px;border:1px solid #eab308"></a>`).join("");return `<div class="card"><b style="color:#fde047">${s.nombre||""} (${s.edad||""})</b><div style="font-size:12px;color:#cbd5e1;margin-top:4px">Tel: ${s.telefono||"-"}<br>${s.ciudad||""}, ${s.estado||""}<br><b>${s.headline||""}</b><br>${s.body||""}</div><div style="display:flex;gap:6px;margin-top:8px">${fs}</div><div class="rbtns"><button style="background:#7f1d1d;color:#fecaca" onclick="delS(\x27${s.id}\x27)">Borrar Solicitud</button></div></div>`;}).join("");}async function tog(id,e){const n=Date.now(),p={activo:e,ciclo_activo:false,paso:0,cmd_id:n+"_"+Math.floor(100+Math.random()*899),cmd_action:e?"RESUME":"PAUSE",status:e?"ACTIVO":"PAUSADO",siguiente_accion:e?"1. Click en Actualizar en 2 min":"Pausado por Admin",updated_at:n};if(e)p.next_ms=n+120000;await sb("cuentas_bot?bot_id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(p)});cargar();}async function cred(id,u,p){const nu=prompt("Usuario:",u);if(nu===null)return;const np=prompt("Clave:",p);if(np===null)return;await sb("cuentas_bot?bot_id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({usuario:nu.trim(),clave:np.trim(),updated_at:Date.now()})});cargar();}async function dias(id,d){await sb("cuentas_bot?bot_id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({vence_ms:Date.now()+(d*86400000),updated_at:Date.now()})});cargar();}async function delB(id){if(confirm("Borrar cuenta?")){await sb("cuentas_bot?bot_id=eq."+encodeURIComponent(id),{method:"DELETE"});cargar();}}async function delS(id){if(confirm("Borrar solicitud?")){await sb("solicitudes?id=eq."+encodeURIComponent(id),{method:"DELETE"});cargar();}}setInterval(()=>{if(!document.hidden&&localStorage.getItem("adm")==="1")cargar();},4000);if(localStorage.getItem("adm")==="1"){vL.classList.add("hide");vP.classList.remove("hide");cargar();}</script></body></html>
