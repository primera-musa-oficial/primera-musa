.lbox{max-width:380px;margin:80px auto;background:#14111a;border:1px solid #3f283c;border-top:3px solid #f43f5e;border-radius:18px;padding:26px;text-align:center}.linp{width:100%;padding:11px;margin:6px 0 12px;border-radius:10px;border:1px solid #2e2938;background:#0b090f;color:#fff}.lbtn{width:100%;padding:12px;border:none;border-radius:10px;background:#e11d48;color:#fff;font-weight:900;cursor:pointer}</style></head><body><div id="vAuth" class="lbox"><div class="logo" style="margin-bottom:6px">Musa</div><div style="font-size:11px;color:#a1a1aa;margin-bottom:16px">ADMIN SUITE &bull; ACCESO PRIVADO</div><input id="au" class="linp" placeholder="Usuario"><input id="ap" type="password" class="linp" placeholder="Contrase&ntilde;a"><button class="lbtn" onclick="if(au.value.trim()==='admin'&&ap.value.trim()==='Musa2026*'){localStorage.setItem('pm_adm_ok','1');vAuth.classList.add('hide');vMain.classList.remove('hide');cargar();}else alert('Credenciales incorrectas')">ENTRAR AL SUITE</button></div><div id="vMain" class="wrap hide">

</div><script>
const U = "https://" + "gkelkdxfmdlvcvyjvwmu" + ".supabase.co/rest/v1";
const K = "sb_publishable_cYTRqB0q933Y23txZK2-wg_NYkJ7OL0";

let BOTS = []; let SOLS = [], SEL = null, IDX = 0, FIL = "all";

function sb(p, o) {
  o = o || {};
  o.headers = Object.assign({ apikey: K, Authorization: "Bearer " + K, "Content-Type": "application/json" }, o.headers || {});
  return fetch(U + "/" + p, o);
}

function setTab(t) { window._curTab = t;
  ["nLobby","nRes","nRen","nSol","nCli","nMen","nAct"].forEach(x => document.getElementById(x).classList.remove("on"));
  secLobby.classList.toggle("hide", t !== "lobby");
  secSol.classList.toggle("hide", t !== "sol");
  secOtro.classList.toggle("hide", t === "lobby" || t === "sol");
  if (t === "lobby") nLobby.classList.add("on");
  else if (t === "sol") { nSol.classList.add("on"); renderSol(); }
  else {
    const map = {res:"nRes",ren:"nRen",cli:"nCli",men:"nMen",act:"nAct"};
    if (map[t]) document.getElementById(map[t]).classList.add("on");
    if(t==="act")renderAct();else if(t==="men")renderMen();else if(t==="cli")renderCli();else if(t==="ren")renderRen();else if(t==="res")renderRes();else secOtro.innerHTML="<h3 style='margin-top:0'>Secci&oacute;n "+t.toUpperCase()+"</h3><p style='color:#a1a1aa'>Sincronizada en tiempo real con Supabase.</p>";
  }
}

function setFil(x) {
  FIL = x;
  ["fAll","fVen","fPro"].forEach(i => document.getElementById(i).classList.remove("on"));
  document.getElementById(x === "all" ? "fAll" : (x === "ven" ? "fVen" : "fPro")).classList.add("on");
  render();
}

function fmtT(ms) {
  if (!ms || ms <= Date.now()) return "0d 0h";
  const d = Math.floor((ms - Date.now()) / 86400000);
  const h = Math.floor(((ms - Date.now()) % 86400000) / 3600000);
  return d + "d " + h + "h";
}

async function cargar() {
  try {
    const [r1, r2] = await Promise.all([sb("cuentas_bot?select=*"), sb("solicitudes?select=*")]);
    const b = await r1.json();
    const s = await r2.json();
    if (Array.isArray(b) && b.length > 0) {
      BOTS = b;
      if (!SEL) SEL = (BOTS.at(0).usuario || BOTS.at(0).cuenta || "Cliente").trim();
    }
    if (Array.isArray(s)) {
      SOLS = s;
      cntSol.innerText = SOLS.length;
    }
    render();
  } catch (e) {}
}function render() { if ((window._pausaSelect && Date.now() < window._pausaSelect) || (document.activeElement && ["SELECT","INPUT","TEXTAREA"].includes(document.activeElement.tagName))) return;
  const now = Date.now(), g = {}; let viv = 0, pau = 0, blo = 0;
  BOTS.forEach(b => {
    const vc = b.vence_ms > 0 && now >= b.vence_ms;
    if (vc) blo++; else if (b.activo) viv++; else pau++;
    const k = (b.usuario || "").trim(); if (!k) return;
    if (!g[k]) g[k] = []; g[k].push(b);
  });
  const ks = Object.keys(g).filter(k => { if (!k.toLowerCase().includes(qBus.value.toLowerCase())) return false; const arr = g[k]; if (FIL === "ven") return arr.some(x => x.vence_ms > now && (x.vence_ms - now) < 172800000); if (FIL === "pro") return arr.some(x => diagAvispa(x).alerta); return true; });
  kCli.innerText = Object.keys(g).length; kViv.innerText = viv; kPau.innerText = pau; kBlo.innerText = blo;
  lblTot.innerText = ks.length + " clientes • " + BOTS.length + " bots";
  gridClientes.innerHTML = ks.map(k => {
    const arr = g[k], dots = arr.map(x => `<span class="dot" style="background:${x.activo ? '#4ade80' : '#facc15'}"></span>`).join("");
    return `<div class="ctile ${SEL === k ? 'sel' : ''}" onclick="SEL='${k}';IDX=0;render()"><div class="cnum">${arr.length}</div><div style="font-weight:800;font-size:12px">${k}</div><div style="font-size:10px;color:#a1a1aa;margin-top:2px">${fmtT(arr.at(0).vence_ms)}</div><div class="dots">${dots}</div></div>`;
  }).join("");
  if (SEL && g[SEL]) {
    const arr = g[SEL], b0 = arr.at(IDX) || arr.at(0), actN = arr.filter(x => x.activo && !(x.vence_ms > 0 && now >= x.vence_ms)).length;
    boxColmena.classList.remove("hide"); boxDetalle.classList.remove("hide");
    boxColmena.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:15px">&#128029; Colmena de ${SEL}</b><div style="font-size:11px;color:#71717a;margin-top:2px">${arr.length} bots &bull; <span style="color:#4ade80">${actN} activos</span></div></div><div style="display:flex;gap:6px"><button class="mbtn" style="background:#be185d;color:#fff;padding:6px 12px" onclick="window._addOpen=!window._addOpen;render()">+ Agregar Avispa</button><button class="fbtn" onclick="SEL=null;render()">&#10005; Cerrar colmena</button></div></div>${window._addOpen ? renderBoxAdd() : ""}<div class="bgrid">` + arr.map((b, i) => {
      const vc = b.vence_ms > 0 && now >= b.vence_ms, ac = !!b.activo && !vc, dotC = vc ? "#f43f5e" : (ac ? "#4ade80" : "#facc15");
      return `<div class="bcard" style="border-color:${IDX === i ? '#f43f5e' : '#2e283b'}" onclick="IDX=${i};render()"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="display:flex;gap:8px;align-items:center"><span style="background:#272230;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:900;color:#d4d4d8">0${i + 1}</span><div><div style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:${dotC};display:inline-block"></span><b style="font-size:12.5px;color:#fff">${b.ad_headline || b.cuenta || b.bot_id}</b></div><div style="font-size:11px;color:#71717a;margin-top:2px">${b.ad_city || ""}, ${b.ad_estado || ""}</div></div></div><span style="font-size:16px">&#129302;</span></div><div style="display:flex;justify-content:space-between;font-size:11px;margin:12px 0 10px"><span style="color:${ac ? '#4ade80' : '#71717a'}">${ac ? '&#9679; ' + (b.siguiente_accion || 'Sincronizando datos...') : '---'}</span><b style="color:#34d399">${fmtT(b.vence_ms)}</b></div><div style="display:flex;gap:6px" ><button class="mbtn" style="background:#14532d;color:#4ade80" onclick="darD('${b.bot_id}',1)">+1d</button><button class="mbtn" style="background:#1e3a8a;color:#93c5fd" onclick="event.stopPropagation();tog('${b.bot_id}')">${ac ? '&#9208;' : '&#9654;'}</button><button class="mbtn" style="background:#7f1d1d;color:#fca5a5" onclick="delB('${b.bot_id}')">&#9940;</button><button class="mbtn" style="background:#064e3b;color:#34d399" onclick="window.open('https://wa.me('${b.telefono || ''}').replace(/\\D/g,''))">WA</button></div></div>`;
    }).join("") + `</div>`;    const fechaV = b0.vence_ms > 0 ? new Date(Number(b0.vence_ms)).toLocaleDateString() : "-";
    const fotosH = (Array.isArray(b0.ad_fotos) ? b0.ad_fotos : []).filter(x => x && !String(x).includes("close") && !String(x).includes("svg")).map(im => `<img src="${im}" style="width:92px;height:92px;object-fit:cover;border-radius:10px;border:1.5px solid #be185d">`).join("");
    const evs = (Array.isArray(b0.historial) && b0.historial.length ? b0.historial : [new Date().toLocaleString() + " - Anuncio activo en Supabase"]).map(ev => `<div style="padding:4px 0;border-bottom:1px solid #1f1b29">${ev}</div>`).join("");
    boxDetalle.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:14px"><div style="width:46px;height:46px;border-radius:13px;background:#831843;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px">${SEL.slice(0,2).toUpperCase()}</div><div><b style="font-size:19px">${SEL}</b><div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#a1a1aa;margin-top:4px"><div><span style="font-size:10px;display:block">Usuario</span><b style="color:#fff">@${SEL}</b></div><div><span style="font-size:10px;display:block">Clave</span><b style="color:#f43f5e">${b0.clave || "-"}</b> <button class="mbtn" style="background:#3f1d2e;color:#fda4af" onclick="navigator.clipboard?.writeText('${b0.clave || ""}');setC('${b0.bot_id}')">copiar / editar</button></div><div><span style="font-size:10px;display:block">WhatsApp</span><b style="color:#4ade80">${b0.telefono || "-"}</b></div><div><span style="font-size:10px;display:block">Vence renta</span><b style="color:#fb7185">${fechaV}</b></div></div></div></div><div style="display:flex;gap:8px"><button class="mbtn" style="background:#15803d;color:#fff;padding:8px 14px" onclick="window.open('https://wa.me('${b0.telefono || ''}').replace(/\\D/g,''))">WhatsApp</button><button class="mbtn" style="background:#3f1d2e;color:#fda4af;padding:8px 14px" onclick="darD('${b0.bot_id}',1)">+1 dia renta</button><button class="mbtn" style="background:#881337;color:#fff;padding:8px 14px" onclick="darD('${b0.bot_id}',7)">+1 sem renta</button></div></div><div style="background:#181420;border:1px solid #2e263b;border-radius:12px;padding:12px;margin-bottom:14px"><div style="font-size:10px;color:#f43f5e;font-weight:800;letter-spacing:1px;margin-bottom:8px">DETALLES Y FOTOS DEL ANUNCIO</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">${fotosH || "<span style='font-size:11px;color:#71717a'>Sin fotos sincronizadas aun</span>"}</div><div style="font-size:12.5px;color:#e4e4e7"><b>T&iacute;tulo:</b> ${b0.ad_headline || b0.cuenta || "-"} &nbsp;&bull;&nbsp; <b>Edad:</b> ${b0.ad_edad || "-"} &nbsp;&bull;&nbsp; <b>Zona:</b> ${b0.ad_city || ""}, ${b0.ad_estado || ""}</div><div style="font-size:12px;color:#a1a1aa;margin-top:4px"><b>Descripci&oacute;n:</b> ${b0.ad_body || "-"}</div></div><div style="font-size:10px;color:#71717a;letter-spacing:1px;margin-bottom:6px">&Uacute;LTIMOS EVENTOS</div><div style="font-size:12px;color:#a1a1aa;max-height:130px;overflow:auto">${evs}</div>`;
  } else { boxColmena.classList.add("hide"); boxDetalle.classList.add("hide"); }
  syncChatsNube(); if(typeof renderSol==="function")renderSol(); if(document.getElementById("inpChat")) renderMen();

let CHATS = {}; async function cargarChatsNube(){ try { const u = "https://" + "gkelkdxfmdlvcvyjvwmu" + ".supabase.co/rest/v1/mensajes_chat?select=*&order=id.asc&_t=" + Date.now(); const k = "sb_publishable_cYTRqB0q933Y23txZK2-wg_NYkJ7OL0"; const res = await fetch(u, { headers: { apikey: k, Authorization: "Bearer " + k } }); const rows = res.ok ? await res.json() : new Array(); const map = new Map(); (BOTS||new Array()).forEach(b=>{ const u2=String(b.usuario||"").trim(); if(u2 && !map.has(u2)) map.set(u2, new Array()); }); (rows||new Array()).forEach(m=>{ const u2=String(m.usuario||"").trim(); if(!u2) return; const arr=map.get(u2)||new Array(); arr.push({from:m.remitente==="admin"?"admin":"client",txt:m.mensaje,time:m.hora||""}); map.set(u2,arr); }); window._chatsMap = map; const ks = Array.from(map.keys()); if((!window._selU || !map.has(window._selU)) && ks.length) window._selU = ks.at(0); if(window._curTab==="men"){ const inp=document.getElementById("inpChat"); const cur=inp?inp.value:""; const foc=inp && document.activeElement===inp; renderMen(); const inp2=document.getElementById("inpChat"); if(inp2){ inp2.value=cur; if(foc) inp2.focus(); } } } catch(e){ console.error(e); } } } async function cargarChatsNube(){ try { const u = "https://" + "gkelkdxfmdlvcvyjvwmu" + ".supabase.co/rest/v1/mensajes_chat?select=*&order=id.asc&_t=" + Date.now(); const k = "sb_publishable_cYTRqB0q933Y23txZK2-wg_NYkJ7OL0"; const res = await fetch(u, { headers: { apikey: k, Authorization: "Bearer " + k } }); const rows = res.ok ? await res.json() : new Array(); const map = new Map(); (BOTS||new Array()).forEach(b=>{ const u2=String(b.usuario||"").trim(); if(u2 && !map.has(u2)) map.set(u2, new Array()); }); (rows||new Array()).forEach(m=>{ const u2=String(m.usuario||"").trim(); if(!u2) return; const arr=map.get(u2)||new Array(); arr.push({from:m.remitente==="admin"?"admin":"client",txt:m.mensaje,time:m.hora||""}); map.set(u2,arr); }); window._chatsMap = map; const ks = Array.from(map.keys()); if((!window._selU || !map.has(window._selU)) && ks.length) window._selU = ks.at(0); if(window._curTab==="men"){ const inp=document.getElementById("inpChat"); const cur=inp?inp.value:""; const foc=inp && document.activeElement===inp; renderMen(); const inp2=document.getElementById("inpChat"); if(inp2){ inp2.value=cur; if(foc) inp2.focus(); } } } catch(e){ console.error(e); } } } setInterval(()=>{ if(window._curTab==="men") cargarChatsNube(); }, 3000); </script>
