async function activarSolicitud(idx) {
  const s = SOLS[idx];
  if (!s) return;
  if (!s.avispa_id) {
    alert("Primero debes seleccionar una Avispa (pagina enlazada) antes de darle a ACTIVADA.");
    return;
  }
  const b = BOTS.find(x => x.bot_id === s.avispa_id);
  if (!b) return alert("Avispa no encontrada.");
  const diasNum = parseInt(String(s.renta || "7")) || 7;
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const fch = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());

  b.usuario = s.usuario;
  b.clave = s.clave;
  b.telefono = s.tel_anuncio || s.telefono; b.whatsapp = s.telefono;
  b.cuenta = s.nombre || b.cuenta;
  b.ad_headline = s.headline || s.nombre || b.ad_headline;
  b.ad_body = s.body || b.ad_body;
  b.ad_edad = s.edad || b.ad_edad;
  b.ad_estado = s.estado || b.ad_estado;
  b.ad_city = s.ciudad || b.ad_city;
  b.ad_location = s.area || b.ad_location;
  if (Array.isArray(s.fotos) && s.fotos.length) b.ad_fotos = s.fotos;
  b.vence_ms = Date.now() + (diasNum * 86400000);
  b.activo = true;
  b.siguiente_accion = "Sincronizando datos...";
  b.historial = Array.isArray(b.historial) ? b.historial : [];
  b.historial.unshift(fch + ' - Solicitud de "' + s.nombre + '" ACTIVADA (' + diasNum + ' dias) con usuario @' + s.usuario);

  SOLS.splice(idx, 1); localStorage.setItem("pm_sol_done", "1"); cntSol.innerText = SOLS.length; if (s.id && !s.id.startsWith("SOL_DEMO")) { sb("solicitudes?id=eq." + encodeURIComponent(s.id), { method: "DELETE" }); }
  localStorage.setItem("pm_demo", JSON.stringify(BOTS));
  SEL = b.usuario;
  IDX = 0;
  setTab("lobby"); render();

  if (!b.bot_id.startsWith("demo") && !b.bot_id.startsWith("ja1w")) {
    await sb("cuentas_bot?bot_id=eq." + encodeURIComponent(b.bot_id), {
      method: "PATCH",
      body: JSON.stringify({
        usuario: b.usuario, clave: b.clave, telefono: b.telefono, cuenta: b.cuenta,
        ad_headline: b.ad_headline, ad_body: b.ad_body, ad_edad: b.ad_edad,
        ad_estado: b.ad_estado, ad_city: b.ad_city, ad_location: b.ad_location,
        ad_fotos: b.ad_fotos, vence_ms: b.vence_ms, activo: true,
        cmd_id: String(Date.now()), cmd_action: "RESUME", historial: b.historial.slice(0, 50), updated_at: Date.now()
      })
    });
  }
  alert("¡Listo! Avispa asignada y ACTIVADA por " + diasNum + " dias.\nUsuario: " + s.usuario + "\nClave: " + s.clave);
}

async function borrarSol(idx) {
  const s = SOLS[idx];
  if (!s || !confirm("¿Eliminar esta solicitud?")) return;
  SOLS.splice(idx, 1); localStorage.setItem("pm_sol_done", "1");
  setTab("lobby"); render();
  if (s.id && !s.id.startsWith("SOL_DEMO")) {
    await sb("solicitudes?id=eq." + encodeURIComponent(s.id), { method: "DELETE" });
  }
}function fmtPub(b, ac) {
  if (!ac) return "<span style='color:#71717a'>Pausada</span>";
  const nm = Number(b.next_ms || 0);
  if (nm > Date.now()) {
    const s = Math.floor((nm - Date.now()) / 1000);
    return "<b style='color:#38bdf8;font-family:Consolas,monospace'>" + String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0") + "</b>";
  }
  return "<b style='color:#4ade80'>En ciclo / Listo</b>";
}

function diagAvispa(b) {
  const now = Date.now();
  const st = String(b.status || "").toLowerCase();
  const paso = String(b.siguiente_accion || "").toLowerCase();
  const txt = st + " " + paso;
  if (/bloq|block|delet|suspend|ban/.test(txt)) return { tipo: "BLOQUEADA", col: "#f43f5e", bg: "rgba(244,63,94,.15)", alerta: true, msg: "Pagina bloqueada o eliminada en plataforma" };
  if (/login|sesion|session|captcha|verif/.test(txt)) return { tipo: "INICIO DE SESION", col: "#fb923c", bg: "rgba(251,146,60,.15)", alerta: true, msg: "Requiere inicio de sesion o captcha en Dolphin" };
  const vc = b.vence_ms > 0 && now >= b.vence_ms;
  if (vc) return { tipo: "RENTA VENCIDA", col: "#f87171", bg: "rgba(248,113,113,.15)", alerta: true, msg: "Tiempo de renta agotado" };
  if (!b.activo) return { tipo: "PAUSADA", col: "#facc15", bg: "rgba(250,204,21,.12)", alerta: false, msg: "Pausada manualmente" };
  const upd = Number(b.updated_at || 0);
  if (upd > 0 && (now - upd) > 1200000) return { tipo: "BOT LENTO", col: "#c084fc", bg: "rgba(192,132,252,.15)", alerta: true, msg: "Sin reportar actividad hace mas de 20 min" };
  if (b.vence_ms > 0 && (b.vence_ms - now) < 86400000) return { tipo: "POR VENCER (<24H)", col: "#38bdf8", bg: "rgba(56,189,248,.15)", alerta: true, msg: "Menos de 24h de renta restante" };
  return { tipo: "OPERANDO NORMAL", col: "#4ade80", bg: "rgba(74,222,128,.12)", alerta: false, msg: b.siguiente_accion || "Publicando en tiempo real" };
}

      <div style="font-size:12px;font-weight:800;color:#fb7185;margin-bottom:10px;letter-spacing:1px">CHATS DE SOPORTE (${clientes.length})</div>
      ${clientes.map(c => {
        const arr = CHATS[c] || [];
        const ult = arr.length ? arr.at(-1).txt : "Sin mensajes";
        return `<div onclick="CHAT_SEL='${c}';renderMen()" style="padding:10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:${CHAT_SEL === c ? '#2d1527' : '#1b1724'};border:1px solid ${CHAT_SEL === c ? '#be185d' : '#2e2938'}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <b style="font-size:13px;color:#fff">@${c}</b>
            <span style="font-size:10px;background:#e11d48;color:#fff;padding:1px 6px;border-radius:99px">${arr.length}</span>
          </div>
          <div style="font-size:11px;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px">${ult}</div>
        </div>`;
      }).join("")}
    </div>
    <div style="background:#16121d;border:1px solid #2b2438;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:space-between">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #272230;padding-bottom:10px;margin-bottom:12px">
          <div><b style="font-size:15px;color:#fff">Soporte con @${CHAT_SEL || "Cliente"}</b><div style="font-size:11px;color:#4ade80">&#9679; Conectado en tiempo real</div></div>
          <button class="fbtn" onclick="simularMsg()">+ Simular msg cliente</button>
        </div>
        <div id="chatScroll" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px">
          ${msgs.map(m => {
            const isAdm = m.from === "admin";
            return `<div style="align-self:${isAdm ? 'flex-end' : 'flex-start'};max-width:78%;background:${isAdm ? '#4c1d3d' : '#221d2b'};border:1px solid ${isAdm ? '#be185d' : '#352e42'};padding:9px 12px;border-radius:12px">
              <div style="font-size:12.5px;color:#f4f4f5">${m.txt}</div>
              <div style="font-size:10px;color:#a1a1aa;margin-top:4px;text-align:right">${isAdm ? 'Admin' : '@' + CHAT_SEL} &bull; ${m.time}</div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;border-top:1px solid #272230;padding-top:10px">
        <input id="inpChat" onkeydown="if(event.key==='Enter')enviarChat()" placeholder="Escribe una respuesta para @${CHAT_SEL}..." style="flex:1;background:#0e0b14;border:1px solid #352e42;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;outline:none">
        <button class="mbtn" style="background:#e11d48;color:#fff;padding:10px 18px;font-size:12px" onclick="enviarChat()">Enviar</button>
      </div>
    </div>
  </div>`;
  const sc = document.getElementById("chatScroll");
  if (sc) sc.scrollTop = sc.scrollHeight;
}

function enviarChat() {
  const inp = document.getElementById("inpChat");
  if (!inp || !inp.value.trim() || !CHAT_SEL) return;
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const fch = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  CHATS[CHAT_SEL] = CHATS[CHAT_SEL] || [];
  CHATS[CHAT_SEL].push({ from: "admin", txt: inp.value.trim(), time: fch });
  localStorage.setItem("pm_chats_real", JSON.stringify(CHATS));
  renderMen();
}

function simularMsg() {
  if (!CHAT_SEL) return;
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const fch = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  CHATS[CHAT_SEL].push({ from: "client", txt: "Hola admin, tengo una consulta sobre mi anuncio.", time: fch });
  localStorage.setItem("pm_chats_real", JSON.stringify(CHATS));
  renderMen();
}
function renderAct() {
  let evs = [];
  BOTS.forEach(b => {
    const u = b.usuario || b.cuenta || "Cliente";
    (Array.isArray(b.historial) ? b.historial : []).forEach(h => {
      const m = h.match(/^(\d{2})\/(\d{2})\/(\d{4}),\s*(\d{2}):(\d{2}):(\d{2})/);
      const ts = m ? new Date(m[3]+"-"+m[2]+"-"+m[1]+"T"+m[4]+":"+m[5]+":"+m[6]).getTime() : 0;
      evs.push({ u, txt: h, ts });
    });
  });
  evs.sort((a, b) => b.ts - a.ts);
  secOtro.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div><h3 style="margin:0">Registro de Actividad en Vivo</h3><span style="font-size:12px;color:#a1a1aa">Historial exacto de pausas y activaciones de clientes</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span style="font-size:11px;color:#4ade80">&#9679; ${evs.length} eventos</span>
      <button class="fbtn" onclick="BOTS.forEach(x=>x.historial=[]);localStorage.setItem('pm_demo',JSON.stringify(BOTS));renderAct()">Limpiar</button>
    </div>
  </div>` + (evs.length ? evs.map(e => {
    const isP = /paus|bloque/i.test(e.txt);
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#191521;border:1px solid #2e283b;border-left:3px solid ${isP ? '#facc15' : '#4ade80'};border-radius:10px;margin-bottom:8px;font-size:12.5px">
      <div><b style="color:#fb7185">@${e.u}</b> &bull; <span style="color:#e4e4e7">${e.txt}</span></div>
      <span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;background:${isP ? 'rgba(250,204,21,.15);color:#facc15' : 'rgba(74,222,128,.15);color:#4ade80'}">${isP ? 'PAUSADA' : 'ACTIVADA'}</span>
    </div>`;
  }).join("") : "<span style='color:#a1a1aa'>Aun no hay movimientos registrados.</span>");
}

function renderBoxAdd() {
  const libres = BOTS.filter(b => !(b.usuario||"").trim() || Number(b.vence_ms||0) <= Date.now());
  const opts = `<option value="">-- Selecciona Avispa Disponible (${libres.length}) --</option>` + libres.map((b, i) => `<option value="${b.bot_id}">&#128029; Avispa Libre 0${i+1}: ${b.ad_headline || b.cuenta || b.bot_id} (${b.ad_city || ''})</option>`).join("");
  const d = window._addDias || "7";
  return `<div style="background:#1c1626;border:1px solid #be185d;border-radius:12px;padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <b style="font-size:12px;color:#fda4af">Sumar Avispa a @${SEL}:</b>
      <select id="selAvispaAdd" style="background:#0e0b14;border:1px solid #4c1d3d;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700">${opts}</select>
      <div style="display:flex;gap:4px">
        <button class="mbtn" style="padding:7px 10px;background:${d==='1'?'#eab308':'#272230'};color:${d==='1'?'#090d16':'#e4e4e7'}" onclick="window._addDias='1';render()">1 D&iacute;a</button>
        <button class="mbtn" style="padding:7px 10px;background:${d==='7'?'#eab308':'#272230'};color:${d==='7'?'#090d16':'#e4e4e7'}" onclick="window._addDias='7';render()">7 D&iacute;as</button>
        <button class="mbtn" style="padding:7px 10px;background:${d==='30'?'#eab308':'#272230'};color:${d==='30'?'#090d16':'#e4e4e7'}" onclick="window._addDias='30';render()">1 Mes</button>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="mbtn" style="background:#16a34a;color:#fff;padding:8px 14px" onclick="confirmarAgregarAvispa()">Confirmar y Asignar</button>
      <button class="mbtn" style="background:#272230;color:#a1a1aa;padding:8px 12px" onclick="window._addOpen=false;render()">Cancelar</button>
    </div>
  </div>`;
}

async function confirmarAgregarAvispa() {
  const id = document.getElementById("selAvispaAdd")?.value;
  if (!id) return alert("Primero selecciona una Avispa disponible de la lista.");
  const bNew = BOTS.find(x => x.bot_id === id);
  if (!bNew) return;
  const dias = parseInt(window._addDias || "7") || 7;
  const base = BOTS.find(x => (x.usuario || "").trim() === SEL) || {};
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const fch = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());

  bNew.usuario = SEL;
  bNew.clave = base.clave || "1234";
  bNew.telefono = base.telefono || "";
  bNew.vence_ms = Date.now() + (dias * 86400000);
  bNew.activo = true;
  bNew.siguiente_accion = "Sincronizando datos...";
  bNew.historial = Array.isArray(bNew.historial) ? bNew.historial : [];
  bNew.historial.unshift(fch + ' - Nueva avispa "' + (bNew.ad_headline || bNew.cuenta || bNew.bot_id) + '" agregada a @' + SEL + ' (' + dias + ' dias)');

  window._addOpen = false;
  localStorage.setItem("pm_demo", JSON.stringify(BOTS));
  IDX = BOTS.filter(x => (x.usuario || "").trim() === SEL).length - 1;
  render();

  if (!bNew.bot_id.startsWith("demo") && !bNew.bot_id.startsWith("ja1w")) {
    await sb("cuentas_bot?bot_id=eq." + encodeURIComponent(bNew.bot_id), {
      method: "PATCH",
      body: JSON.stringify({
        usuario: bNew.usuario, clave: bNew.clave, telefono: bNew.telefono,
        vence_ms: bNew.vence_ms, activo: true, cmd_id: String(Date.now()),
        cmd_action: "RESUME", historial: bNew.historial.slice(0, 50), updated_at: Date.now()
      })
    });
  }
}async function tog(id) {
  window._lockLoad = Date.now() + 6000;
  const b = BOTS.find(i => i.bot_id === id); if (!b) return;
  b.activo = !b.activo;
  const cid = String(Date.now());
  b.cmd_id = cid;
  b.cmd_action = b.activo ? "RESUME" : "PAUSE";
  b.next_ms = b.activo ? (Date.now() + 120000) : 0;
  b.siguiente_accion = b.activo ? "1. Esperando 02:00 para Actualizar (1 clic)" : "Pausada";
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const fch = p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+", "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  b.historial = Array.isArray(b.historial) ? b.historial : [];
  b.historial.unshift(fch + ' - Admin: Pagina "' + (b.ad_headline || b.cuenta || id) + '" ' + (b.activo ? 'activada' : 'pausada'));
  render();
  await sb("cuentas_bot?bot_id=eq." + encodeURIComponent(id), {
    method: "PATCH",
    body: JSON.stringify({
      activo: b.activo,
      cmd_id: cid,
      cmd_action: b.cmd_action,
      next_ms: b.next_ms,
      siguiente_accion: b.siguiente_accion,
      historial: b.historial.slice(0, 50),
      updated_at: Date.now()
    })
  });
}
async function delB(id) {
  if (!confirm("¿Eliminar esta pagina?")) return;
  BOTS = BOTS.filter(i => i.bot_id !== id);
  localStorage.setItem("pm_demo", JSON.stringify(BOTS));
  render();
  if (!id.startsWith("demo") && !id.startsWith("ja1w")) {
    await sb("cuentas_bot?bot_id=eq." + encodeURIComponent(id), { method: "DELETE" });
  }
}

async function setC(id) {
  const u = prompt("Usuario:", SEL); if (u === null) return;
  const p = prompt("Clave:"); if (p === null) return;
  BOTS.forEach(x => { if ((x.usuario || x.cuenta) === SEL) { x.usuario = u.trim(); x.clave = p.trim(); } });
  SEL = u.trim();
  localStorage.setItem("pm_demo", JSON.stringify(BOTS));
  render();
  if (!id.startsWith("demo") && !id.startsWith("ja1w")) {
    await sb("cuentas_bot?bot_id=eq." + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify({ usuario: u.trim(), clave: p.trim(), updated_at: Date.now() }) });
  }
}

const savedDemo = localStorage.getItem("pm_demo");
if (savedDemo) { try { const parsed = JSON.parse(savedDemo); if (Array.isArray(parsed) && parsed.length) BOTS = parsed; if (!BOTS.some(x => !x.usuario)) BOTS.push({bot_id:"demo_libre_1",usuario:"",clave:"",cuenta:"Avispa Libre Miami 01",telefono:"",activo:false,vence_ms:0,ad_city:"Miami",ad_estado:"Florida (FL)",ad_headline:"Avispa Libre Miami 01",ad_edad:"23",ad_body:"",siguiente_accion:"---",bumps:0,ad_fotos:[],historial:[]},{bot_id:"demo_libre_2",usuario:"",clave:"",cuenta:"Avispa Libre Orlando 02",telefono:"",activo:false,vence_ms:0,ad_city:"Orlando",ad_estado:"Florida (FL)",ad_headline:"Avispa Libre Orlando 02",ad_edad:"24",ad_body:"",siguiente_accion:"---",bumps:0,ad_fotos:[],historial:[]}); } catch (e) {} }
if(localStorage.getItem("pm_adm_ok")==="1"){vAuth.classList.add("hide");vMain.classList.remove("hide");cargar();setInterval(()=>{if(!document.hidden)cargar();},4000);}
</script></body></html>
